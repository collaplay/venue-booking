<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CollaPlay 報價單</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#222; --muted:#777; --line:#ddd; --accent:#b8864f; --bg:#f4f1ec; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Noto Sans TC',sans-serif; color:var(--ink); background:var(--bg); display:flex; gap:24px; padding:24px; align-items:flex-start; }
  #editor { width:440px; flex-shrink:0; background:#fff; border-radius:12px; padding:16px; font-size:13px; position:sticky; top:24px; max-height:calc(100vh - 48px); overflow:auto; }
  #editor h3 { margin:18px 0 8px; font-size:14px; color:var(--accent); }
  #editor label { display:block; margin:6px 0 2px; color:var(--muted); font-size:12px; }
  #editor input, #editor select, #editor textarea { width:100%; padding:6px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .row { display:flex; gap:6px; } .row > * { flex:1; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; }
  .std { color:var(--muted); font-size:12px; margin-top:4px; }
  #editor input.ro { background:#f6f4f0; color:var(--muted); cursor:not-allowed; }
  button { padding:7px 12px; border:0; border-radius:6px; background:#222; color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:none; color:#a33; padding:2px 6px; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; }
  /* 固定兩頁：第 1 頁報價明細、第 2 頁備註與簽章；每頁（.sheet）是一張 A4，logo 靠 margin-top:auto 貼在頁尾 */
  #paper { width:210mm; font-size:10.5pt; line-height:1.55; }
  .sheet { background:#fff; min-height:297mm; padding:25mm 15mm 10mm; display:flex; flex-direction:column; box-shadow:0 2px 12px rgba(0,0,0,.08); margin-bottom:24px; }
  #paper .logo { display:block; height:20mm; margin:auto auto 0; padding-top:8mm; box-sizing:content-box; break-inside:avoid; }
  #paper h1 { font-size:17pt; text-align:center; margin:0 0 4px; letter-spacing:1px; }
  #paper { --brand:#EAA45D; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid var(--brand); padding-bottom:10px; margin-bottom:16px; }
  #paper .head h1 { font-size:17pt; white-space:nowrap; text-align:left; margin:0; letter-spacing:2px; line-height:1.2; }
  .head .en { font-family:'Gill Sans','Gill Sans MT',sans-serif; font-size:8.5pt; letter-spacing:3px; color:var(--muted); margin-top:4px; }
  .head .meta { text-align:right; font-size:9pt; color:var(--muted); line-height:1.7; } .head .meta b { color:var(--ink); font-weight:500; }
  .event { font-size:11pt; font-weight:700; margin-bottom:12px; }
  .parties { display:flex; gap:24px; margin-bottom:20px; font-size:9.5pt; line-height:1.75; }
  .parties > div { flex:1; }
  .parties .lbl { font-size:8pt; letter-spacing:2px; color:var(--muted); display:block; }
  .parties b { display:block; margin-bottom:2px; font-size:10.5pt; }
  table { width:100%; border-collapse:collapse; font-size:9.5pt; }
  th { color:var(--ink); font-weight:700; font-size:9pt; padding:7px 6px; text-align:left; border-top:1.5px solid var(--ink); border-bottom:1px solid var(--ink); }
  td { border-bottom:1px solid var(--line); padding:9px 6px; vertical-align:top; }
  td.amt, th.amt { text-align:right; white-space:nowrap; }
  td.date { white-space:nowrap; }
  .sum td { border:0; padding:3px 6px; }
  .sum .big td { font-weight:700; font-size:13pt; border-top:1.5px solid var(--ink); border-bottom:2px solid var(--brand); padding:8px 6px; }
  .sum .pay td { color:var(--muted); }
  .terms { font-size:9.5pt; line-height:1.8; } .terms ol { padding-left:18px; margin:8px 0; } .terms li { margin-bottom:3px; } .terms > b { font-size:12pt; display:block; border-bottom:2px solid var(--brand); padding-bottom:8px; margin-bottom:10px; letter-spacing:2px; }
  .bank { font-size:9.5pt; background:#FCF1E2; border-left:3px solid var(--brand); padding:10px 14px; border-radius:4px; margin-top:22px; line-height:1.75; }
  .sign { display:flex; gap:32px; margin-top:40px; font-size:9.5pt; } .sign > div { flex:1; }
  .pageno { position:absolute; right:15mm; bottom:12mm; font-size:8pt; color:var(--muted); font-family:'Gill Sans','Gill Sans MT',sans-serif; letter-spacing:1px; } .sheet { position:relative; }
  .sign .ln { border-bottom:1px solid #222; height:64px; }
  @media (max-width: 1100px) { body { flex-direction:column; padding:16px; } #editor { width:100%; position:static; max-height:none; } #paper { width:100%; } .sheet { min-height:0; } }
  @page { size:A4; margin:0; }
  /* Google Fonts 的 Noto Sans TC 是可變字型，Chrome 會把它轉成 Type3 嵌入，Acrobat 顯示空白；PingFang 同樣是可變字型。列印改用靜態的 Heiti TC */
  @media print { body { font-family:'Heiti TC','Microsoft JhengHei',sans-serif; background:#fff; padding:0; display:block; } #editor { display:none; } #paper { width:210mm; } .sheet { box-shadow:none; margin:0; min-height:296.5mm; } .sheet + .sheet { break-before:page; } .sign, .bank, tr { break-inside:avoid; } }
</style>
</head>
<body>
<div id="editor"></div>
<div id="paper"></div>
<input type="file" id="loader" accept=".json" hidden>
<script src="config.js"></script>
<script src="pricing.js"></script>
<script>
const LOGO = 'logo.png'; // 放在場租系統裡時，route.ts 會把它換成內嵌圖檔
const today = new Date().toLocaleDateString('en-CA'); // 本地時區的 YYYY-MM-DD（toISOString 是 UTC，台灣早上 8 點前會變成前一天）
const blankLine = () => ({ space:'workshop', plan:'A', date:'', start:'13:00', end:'16:00', holiday:false, override:'', reason:'' });
let Q = {
  lang:'zh', date:today, validDays:3, payDays:3, payBy:'', event:'',
  client:{ name:'', taxId:'', contact:'', phone:'', email:'', address:'' },
  lines:[blankLine()], discount:100, addons:[], depositManual:'', fullPay:false, note:'',
};

const T = {
  zh:{ title:'《可能存在的遊樂園》場地租借報價單', date:'報價日期', client:'承租方', lessor:'出租方', taxId:'統一編號',
       contact:'聯絡人', rep:'負責人', phone:'聯絡電話', email:'電子信箱', addr:'地址', item:'項目', desc:'說明', day:'日期', amt:'含稅金額',
       disc:'長期合作優惠', discDesc:d => `場地費 ${d % 10 ? d : d / 10} 折`, total:'合計（含稅）', net:'未稅金額', tax:'營業稅 5%',
       deposit:'訂金', balance:'尾款', payDep:n => `訂金 NT$${n} `, payFull:n => `全額 NT$${n} `, paidSwap:[['已付訂金', '已付款項'], ['訂金', '已付款項']], payIn:n => `確認報價後 ${n} 日內`, payBy:d => ` ${d} 前`,terms:'備註', bank:'匯款資訊',
       hot:'熱飲', iced:'冰飲', bucket:'桶', person:'人', pastry:t => `手作點心 NT$${t}／人方案`, pastryDesc:(n, t) => `每人 ${n} 款：${t}`, minQty:'最低訂購量',
       bankL:'銀行', acct:'帳號', acctName:'戶名', sign:'簽章及日期' },
  en:{ title:'CollaPlay Venue Rental Quotation', date:'Date', client:'Client', lessor:'Lessor', taxId:'Tax ID',
       contact:'Contact', rep:'Representative', phone:'Phone', email:'Email', addr:'Address', item:'Item', desc:'Description', day:'Date', amt:'Amount (incl. tax)',
       disc:'Long-term Partner Discount', discDesc:d => `${100 - d}% off venue fees`, total:'Total (incl. 5% tax)', net:'Subtotal (excl. tax)', tax:'Business Tax 5%',
       deposit:'Deposit', balance:'Balance', payDep:n => `the deposit of NT$${n}`, payFull:n => `the full amount of NT$${n}`, paidSwap:[['Once the deposit is received', 'Once payment is received'], ['the deposit paid', 'the amount paid'], ['the deposit', 'the amount paid']], payIn:n => `within ${n} days of confirming this quotation`, payBy:d => `by ${d}`,terms:'Terms & Conditions', bank:'Bank Transfer Details', bankL:'Bank', acct:'Account No.', acctName:'Account Name', sign:'Signature & Date',
       hot:'hot', iced:'iced', bucket:'dispenser(s)', person:'guests', pastry:t => `Handmade Pastry Set, NT$${t} per person`, pastryDesc:(n, t) => `${n} items per person: ${t}`, minQty:'minimum order' },
};
const CATS = [['drink', '飲品（桶裝）'], ['pastry', '手作點心（每人方案）'], ['meal', '餐點（每人）'], ['equip', '設備'], ['other', '其他']];
const newAddon = cat => ({
  drink: { cat, item:0, temp:'熱', qty:1, unit:CONFIG.drinks[0].unit },
  pastry: { cat, tier:150, picks:[], flavor:0, qty:15, unit:150 },
  meal: { cat, zh:'餐點', en:'Meal', qty:20, unit:150 },
  equip: { cat, item:0, qty:1, unit:CONFIG.equipment[0].unit },
  other: { cat, item:'', zh:'', en:'', qty:1, unit:0 },
})[cat];

// 自行新增的點心只存在這台電腦的瀏覽器；要永久加入請寫進 config.js
const loadExtra = () => { try { return JSON.parse(localStorage.getItem('cp-extra-pastries')) || []; } catch { return []; } };
const allPastries = () => CONFIG.pastries.concat(loadExtra());
function addPastry() {
  const zh = prompt('新點心中文名稱'); if (!zh) return;
  const en = prompt('英文名稱（English name）', '') || zh;
  const only300 = confirm(`「${zh}」只放在 $300 方案嗎？\n確定＝只有 $300；取消＝$150 與 $300 都有`);
  const list = loadExtra(); list.push({ zh, en, tiers: only300 ? [300] : [150, 300] });
  try { localStorage.setItem('cp-extra-pastries', JSON.stringify(list)); } catch { alert('瀏覽器不允許儲存，新點心只在這次有效'); CONFIG.pastries.push(list.at(-1)); }
  renderEditor();
}

const opt = (list, v) => list.map((x, j) => `<option value="${j}" ${String(j) === String(v) ? 'selected' : ''}>${esc(x.zh)}　$${x.unit}</option>`).join('');
function addonFields(a, i) {
  const k = f => `addons.${i}.${f}`, qtyUnit = (ql, ul) => `<div class="row"><div><label>${ql}</label>${inp(k('qty'), a.qty, 'number')}</div><div><label>${ul}</label>${inp(k('unit'), a.unit, 'number')}</div></div>`;
  if (a.cat === 'drink') {
    const d = CONFIG.drinks[a.item];
    return `<div class="row"><div><label>品項</label><select data-k="${k('item')}">${opt(CONFIG.drinks, a.item)}</select></div>
      <div style="flex:0 0 80px"><label>冰／熱</label>${sel(k('temp'), a.temp, d.temps.map(t => [t, t]))}</div></div>${qtyUnit('桶數', '每桶單價')}
      <div class="std">${CONFIG.drinkNote.zh}；需於活動三日前預訂</div>`;
  }
  if (a.cat === 'pastry') {
    const list = allPastries().filter(p => p.tiers.includes(Number(a.tier)));
    const warn = list.filter(p => p.min && a.picks.includes(p.zh) && a.qty < p.min).map(p => `${p.zh}最低 ${p.min} 個`);
    const muffin = list.find(p => p.flavors && a.picks.includes(p.zh));
    return `<label>方案</label>${sel(k('tier'), String(a.tier), [['150', `$150／人・${allPastries().filter(p => p.tiers.includes(150)).length} 擇 ${CONFIG.pastryPick}`], ['300', `$300／人・${allPastries().filter(p => p.tiers.includes(300)).length} 擇 ${CONFIG.pastryPick}`]])}
      <label>選 ${CONFIG.pastryPick} 款（已選 ${a.picks.length}）</label>
      ${list.map(p => `<label style="color:inherit;display:inline-block;margin-right:10px"><input type="checkbox" data-pick="${i}" value="${esc(p.zh)}" style="width:auto" ${a.picks.includes(p.zh) ? 'checked' : ''}> ${esc(p.zh)}</label>`).join('')}
      ${muffin ? `<label>馬芬口味</label>${sel(k('flavor'), String(a.flavor), muffin.flavors.map((f, j) => [String(j), f[0]]))}` : ''}
      <button class="ghost" style="color:var(--accent)" onclick="addPastry()">＋ 新增點心品項</button>
      ${qtyUnit('人數', '每人單價')}
      <div class="std">點心需於活動十日前預訂${warn.length ? `<br><b style="color:#a33">${warn.join('、')}</b>` : ''}${a.picks.length !== CONFIG.pastryPick ? `<br><b style="color:#a33">請選 ${CONFIG.pastryPick} 款</b>` : ''}</div>`;
  }
  if (a.cat === 'meal') return `<div class="row"><div><label>品名</label>${inp(k('zh'), a.zh)}</div><div><label>English</label>${inp(k('en'), a.en)}</div></div>${qtyUnit('人數', '每人單價')}`;
  if (a.cat === 'equip') return `<label>品項</label><select data-k="${k('item')}">${opt(CONFIG.equipment, a.item)}</select>${qtyUnit('數量', '單價')}`;
  return `<label>品項</label><select data-k="${k('item')}"><option value="">自訂</option>${opt(CONFIG.others, a.item)}</select>
    <div class="row"><div><label>品名</label>${inp(k('zh'), a.zh)}</div><div><label>English</label>${inp(k('en'), a.en)}</div></div>${qtyUnit('數量', '單價')}`;
}
const money = n => 'NT$ ' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const longDate = (d, lang) => { if (!d) return ''; const [y, m, dd] = d.split('-').map(Number);
  return lang === 'zh' ? `${y} 年 ${m} 月 ${dd} 日` : new Date(y, m - 1, dd).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }); };
const shortDate = d => d ? d.replace(/-0?/g, '/') : '';

// ---------- editor ----------
const inp = (k, v, type = 'text', extra = '') => `<input data-k="${k}" type="${type}" value="${esc(v)}" ${extra}>`;
// 從專案帶入時，專案已有的欄位鎖住（正本在專案，這裡改了下次開啟也會被蓋回去）
const pinp = (k, v) => Q.fromProject ? `<input value="${esc(v)}" readonly class="ro" title="來自專案，要修改請回專案編輯">` : inp(k, v);
const sel = (k, v, opts) => `<select data-k="${k}">${opts.map(([val, txt]) => `<option value="${val}" ${val === v ? 'selected' : ''}>${esc(txt)}</option>`).join('')}</select>`;

function renderEditor() {
  const c = Q.client;
  document.getElementById('editor').innerHTML = `
    <div class="bar">
      ${sel('lang', Q.lang, [['zh', '中文版'], ['en', 'English']])}
      ${Q.fromProject ? '' : '<button onclick="printPdf()">列印／存 PDF</button>'}
      ${Q.fromProject ? '' : `<button onclick="saveJson()" title="把目前填的內容存成檔案下載到這台電腦，之後可以開啟接著改">儲存草稿</button>
      <button onclick="loader.click()" title="選擇之前用「儲存草稿」下載的檔案，接著修改">開啟草稿</button>`}
    </div>
    <h3>報價資訊</h3>
    <div class="row"><div><label>報價日期</label>${inp('date', Q.date, 'date')}</div><div><label>報價有效天數</label>${inp('validDays', Q.validDays, 'number')}</div><div><label>確認後幾天內匯款</label>${inp('payDays', Q.payDays, 'number')}</div></div>
    <label>或指定匯款截止日（填了就印日期，不用天數）</label>${inp('payBy', Q.payBy, 'date')}
    <label>活動名稱（檔名用）</label>${pinp('event', Q.event)}
    <h3>承租方</h3>
    ${Q.fromProject ? '<div class="std">灰色欄位來自專案，要修改請回專案編輯；Email 與地址在這裡填。</div>' : ''}
    <label>公司／個人名稱</label>${pinp('client.name', c.name)}
    <div class="row"><div><label>統一編號</label>${pinp('client.taxId', c.taxId)}</div><div><label>聯絡人</label>${pinp('client.contact', c.contact)}</div></div>
    <div class="row"><div><label>電話</label>${pinp('client.phone', c.phone)}</div><div><label>Email</label>${inp('client.email', c.email)}</div></div>
    <label>地址（發票用，可空白）</label>${inp('client.address', c.address)}
    <h3>場地</h3>
    ${Q.lines.map((l, i) => l.locked ? `<div class="card">
      <b>${esc(l.label.zh)}</b>
      <div class="std">${shortDate(l.date)}${l.endDate ? '–' + shortDate(l.endDate) : ''}　${l.start}–${l.end}</div>
      <div class="std">場地費 ${money(lineAmount(l, CONFIG))}${Q.discountNote ? `（已含長期合作 ${Q.discountNote} 折）` : ''}</div>
      ${l.reason ? `<div class="std">議價理由（不印出）：${esc(l.reason)}</div>` : ''}
      ${lineAmount(l, CONFIG) ? '' : '<div class="std"><b style="color:#a33">專案裡這筆的場地費是 0，請先回專案填場地費。</b></div>'}
    </div>` : `<div class="card">
      <div class="row"><div>${sel(`lines.${i}.space`, l.space, CONFIG.spaces.map(s => [s.id, s.zh]))}</div>
        <button class="ghost" style="flex:0;color:var(--accent);white-space:nowrap" onclick="dupLine(${i})">複製</button>
        <button class="ghost" style="flex:0;white-space:nowrap" onclick="del('lines',${i})">刪除</button></div>
      <div class="row">
        <div><label>日期</label>${inp(`lines.${i}.date`, l.date, 'date')}</div>
        <div><label>開始</label>${inp(`lines.${i}.start`, l.start, 'time', 'step="1800"')}</div>
        <div><label>結束</label>${inp(`lines.${i}.end`, l.end, 'time', 'step="1800"')}</div>
      </div>
      <div class="row">
        <div><label>方案（教室／展演廳）</label>${sel(`lines.${i}.plan`, l.plan, [['A', 'A 課程會議講座'], ['B', 'B 商業活動派對']])}</div>
        <div><label>&nbsp;</label><label style="color:inherit"><input data-k="lines.${i}.holiday" type="checkbox" style="width:auto" ${l.holiday ? 'checked' : ''}> 國定假日（以假日計）</label></div>
      </div>
      <div class="row"><div><label>議價金額（空白＝標準價）</label>${inp(`lines.${i}.override`, l.override, 'number')}</div>
        <div><label>議價理由（不印出）</label>${inp(`lines.${i}.reason`, l.reason)}</div></div>
      <div class="std" id="std-${i}"></div>
    </div>`).join('')}
    ${Q.fromProject ? `<div class="std">場地、日期、時間、場地費都來自專案。要修改請按左上角「回專案」編輯，存檔後再開啟報價單就會更新。</div>` : `<button onclick="addLine()">＋ 場地</button>
    <label>長期合作折扣（輸入 85＝85 折、8 折輸入 80；空白＝無。報價單上直接印折扣後金額）</label>${inp('discount', Q.discount === 100 || !Q.discount ? '' : Q.discount, 'number', 'min="1" max="100"')}`}
    <h3>加購（餐飲、設備）</h3>
    ${Q.addons.map((a, i) => `<div class="card">
      <div class="row"><b style="flex:1">${(CATS.find(c => c[0] === a.cat) || [, '自訂'])[1]}</b>
        <button class="ghost" style="flex:0" onclick="del('addons',${i})">刪除</button></div>
      ${addonFields(a, i)}
      <label>供應時間／說明（例：上午 10:00 提供；中英版共用）</label>${inp(`addons.${i}.note`, a.note || '')}
    </div>`).join('')}
    <div class="row">${sel('_addon', '', [['', '＋ 加購：選擇分類…'], ...CATS])}</div>
    ${Q.fromProject ? '<div class="std" id="fnb-note"></div>' : ''}
    <h3>付款</h3>
    <label style="color:inherit"><input data-k="fullPay" type="checkbox" style="width:auto" ${Q.fullPay ? 'checked' : ''}> 全額付款（不印訂金、尾款）</label>
    ${Q.fullPay ? '' : `<label>訂金（空白＝合計 50%）</label>${inp('depositManual', Q.depositManual, 'number')}`}
    <label>其他備註（印在條款最後；按 Enter 換行，每一行會成為獨立的一條）</label><textarea data-k="note" rows="4">${esc(Q.note)}</textarea>`;
  renderPreview();
}

function setPath(path, val) {
  const keys = path.split('.'); let o = Q;
  keys.slice(0, -1).forEach(k => o = o[k]);
  o[keys.at(-1)] = val;
}
document.getElementById('editor').addEventListener('input', e => {
  window.quoteDirty = true; // 有未儲存的修改（專案模式離開頁面前會提醒）
  const pick = e.target.dataset.pick;
  if (pick !== undefined) {
    const a = Q.addons[pick], v = e.target.value;
    a.picks = e.target.checked ? [...a.picks, v] : a.picks.filter(x => x !== v);
    return renderEditor();
  }
  const k = e.target.dataset.k; if (!k) return;
  if (k === '_addon') { if (e.target.value) Q.addons.push(newAddon(e.target.value)); return renderEditor(); }
  setPath(k, e.target.type === 'checkbox' ? e.target.checked : k === 'discount' ? (Number(e.target.value) || 100) : e.target.value);
  if (k === 'fullPay') return renderEditor();

  // 換品項／方案時帶入對應單價，並重畫編輯區
  const m = k.match(/^addons\.(\d+)\.(item|tier)$/);
  if (m) {
    const a = Q.addons[m[1]];
    if (a.cat === 'drink') { const d = CONFIG.drinks[a.item]; a.unit = d.unit; if (!d.temps.includes(a.temp)) a.temp = d.temps[0]; }
    if (a.cat === 'equip') a.unit = CONFIG.equipment[a.item].unit;
    if (a.cat === 'other' && a.item !== '') Object.assign(a, { zh:CONFIG.others[a.item].zh, en:CONFIG.others[a.item].en, unit:CONFIG.others[a.item].unit });
    if (a.cat === 'pastry') { a.unit = Number(a.tier); a.picks = a.picks.filter(z => allPastries().find(p => p.zh === z)?.tiers.includes(a.unit)); }
    return renderEditor();
  }
  renderPreview();
});

// 預覽表格的品名與說明
function addonText(a, L) {
  // 數量為 1 時金額欄已經說明一切，說明欄留白
  const one = Number(a.qty) === 1, t = T[L], each = one ? '' : `${a.qty} × ${money(a.unit)}`;
  if (a.cat === 'drink') {
    const d = CONFIG.drinks[a.item], temp = a.temp === '冰' ? t.iced : t.hot;
    return [L === 'zh' ? `${d.zh}・${temp}` : `${d.en} (${temp})`, one ? '' : `${a.qty} ${t.bucket} × ${money(a.unit)}`];
  }
  if (a.cat === 'pastry') {
    const names = a.picks.map(z => {
      const p = allPastries().find(x => x.zh === z); if (!p) return z;
      const f = p.flavors?.[a.flavor];
      return L === 'zh' ? p.zh + (f ? `（${f[0]}）` : '') : (f ? `${f[1]} ` : '') + p.en;
    }).join(L === 'zh' ? '、' : ', ');
    return [t.pastry(a.unit), t.pastryDesc(a.picks.length, esc(names)) + (one ? '' : `<br>${a.qty} ${t.person} × ${money(a.unit)}`)];
  }
  if (a.cat === 'meal') return [a[L] || a.zh, one ? '' : `${a.qty} ${t.person} × ${money(a.unit)}`];
  if (a.cat === 'equip') return [CONFIG.equipment[a.item][L], each];
  return [a[L] || a.zh, each];
}
// 新增場地沿用上一筆的日期、時間、國定假日設定
function addLine() {
  const prev = Q.lines.at(-1);
  Q.lines.push(prev ? { ...blankLine(), date:prev.date, start:prev.start, end:prev.end, holiday:prev.holiday } : blankLine());
  renderEditor();
}
// 複製整張場地卡（含議價），日期加一天，插在原卡下方
function dupLine(i) {
  const l = Q.lines[i], d = l.date ? new Date(l.date + 'T00:00') : null;
  if (d) d.setDate(d.getDate() + 1);
  const date = d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
  Q.lines.splice(i + 1, 0, { ...l, date });
  renderEditor();
}
const del = (list, i) => { Q[list].splice(i, 1); window.quoteDirty = true; renderEditor(); };

// ---------- preview ----------
function renderPreview() {
  const C = Q.lang === "zh" ? "：" : ": ";
  const L = Q.lang, t = T[L], tot = totals(Q, CONFIG), lessor = CONFIG.lessor, c = Q.client;
  Q.lines.forEach((l, i) => {
    const p = standardPrice(l, CONFIG), el = document.getElementById('std-' + i);
    if (el) el.textContent = p ? `標準價 ${money(p.amount)}：${p.zh}` : (CONFIG.spaces.find(s => s.id === l.space)?.rule === 'manual' ? '此空間尚無正式價，請輸入議價金額' : '填日期與時間後計算標準價');
  });
  // 從專案帶入時：提示加購合計與專案餐飲費是否一致（餐飲費不會自動同步，儲存到專案時才詢問）
  const fnbNote = document.getElementById('fnb-note');
  if (fnbNote) {
    const same = tot.addons === (Q.projectFnb || 0);
    fnbNote.className = same ? 'std' : 'warn';
    fnbNote.innerHTML = same ? `專案的餐飲費目前是 ${money(Q.projectFnb || 0)}，與加購合計一致。`
      : `⚠ 餐飲費與專案不一致<br>專案的餐飲費：${money(Q.projectFnb || 0)}<br>報價單加購合計：${money(tot.addons)}<br><span style="font-weight:400">加購不會自動寫回專案。按上方「儲存到專案」時會跳出視窗，讓你選擇要不要更新專案。</span>`;
  }
  // 同一場地的多個日期排在一起（場地依第一次出現的順序，組內依日期時間），場地名只寫一次
  // 從專案帶入的列（locked）用專案的空間名稱，可一列多空間
  const nameOf = l => l.label ? l.label[L] : CONFIG.spaces.find(s => s.id === l.space)[L];
  const order = [...new Set(Q.lines.map(nameOf))];
  const sorted = [...Q.lines].sort((a, b) => order.indexOf(nameOf(a)) - order.indexOf(nameOf(b)) || (a.date + a.start).localeCompare(b.date + b.start));
  const rows = sorted.map((l, i) => {
    const span = sorted.filter(x => nameOf(x) === nameOf(l)).length;
    const first = i === 0 || nameOf(sorted[i - 1]) !== nameOf(l);
    const time = l.start && l.end ? `${l.start}–${l.end}` : '';
    return `<tr>${first ? `<td rowspan="${span}">${esc(nameOf(l)).replace(/＋| \+ /g, '<br>')}</td>` : ''}<td class="date">${shortDate(l.date)}${l.endDate ? '–' + shortDate(l.endDate).replace(/^\d+\//, '') : ''}</td><td>${time}</td><td class="amt">${money(discounted(lineAmount(l, CONFIG), Q))}</td></tr>`; // 報價單只印折扣後金額，不另列折扣
  });
  Q.addons.forEach(a => {
    const [name, desc] = addonText(a, L);
    rows.push(`<tr><td>${esc(name)}</td><td></td><td>${[desc, a.note ? esc(a.note) : ""].filter(Boolean).join("<br>")}</td><td class="amt">${money(a.qty * a.unit)}</td></tr>`);
  });
  const payment = (Q.fullPay ? t.payFull : t.payDep)(tot.deposit.toLocaleString('en-US'));
  // 全額付款時，退改規則的「訂金」改寫成「已付款項」
  const paid = x => Q.fullPay ? t.paidSwap.reduce((s, [a, b]) => s.replaceAll(a, b), x) : x;
  const terms = CONFIG.terms[L].map(s => Array.isArray(s) ? s.map(paid) : s.replace('{valid}', Q.validDays).replace('{payWhen}', Q.payBy ? t.payBy(longDate(Q.payBy, L)) : t.payIn(Q.payDays ?? 3)).replace('{payment}', payment));
  // 其他備註：每一行各自成為一條（接在條款後面繼續編號）
  if (Q.note) terms.push(...Q.note.split('\n').map(x => x.trim()).filter(Boolean));
  const party = (title, name, rows) => `<div><span class="lbl">${title}</span><b>${esc(name)}</b>${rows.filter(r => r[1]).map(r => `${r[0]}${C}${esc(r[1])}`).join('<br>')}</div>`;

  const vd = new Date(Q.date + 'T00:00'); vd.setDate(vd.getDate() + (Number(Q.validDays) || 0));
  const validUntil = `${vd.getFullYear()}-${String(vd.getMonth() + 1).padStart(2, '0')}-${String(vd.getDate()).padStart(2, '0')}`;
  const logo = `<img class="logo" src="${LOGO}" alt="CollaPlay 可能存在的遊樂園">`;
  document.getElementById('paper').innerHTML = `
    <div class="sheet">
    <div class="head">
      <div><h1${L === 'zh' ? ' style="margin-left:-0.5em"' : ''}>${t.title}</h1>${L === 'zh' ? '<div class="en">VENUE RENTAL QUOTATION</div>' : ''}</div>
      <div class="meta">${t.date}${C}<b>${longDate(Q.date, L)}</b>${Q.date ? `<br>${L === 'zh' ? '報價有效至' : 'Valid until'}${C}<b>${longDate(validUntil, L)}</b>` : ''}</div>
    </div>
    ${Q.event ? `<div class="event">${esc(Q.event)}</div>` : ''}
    <div class="parties">
      ${party(t.client, c.name, [[t.taxId, c.taxId], [t.contact, c.contact], [t.phone, c.phone], [t.email, c.email], [t.addr, c.address]])}
      ${party(t.lessor, lessor[L], [[t.taxId, lessor.taxId], [t.rep, L === 'zh' ? lessor.repZh : lessor.repEn], [t.email, lessor.email], [t.phone, lessor.phone], [t.addr, L === 'zh' ? lessor.addrZh : lessor.addrEn]])}
    </div>
    <table>
      <tr><th style="width:36%">${t.item}</th><th style="width:13%">${t.day}</th><th>${t.desc}</th><th class="amt" style="width:16%">${t.amt}</th></tr>
      ${rows.join('')}
    </table>
    <table class="sum" style="width:50%;margin-left:auto;margin-top:6px">
      <tr><td>${t.net}</td><td class="amt">${money(tot.net)}</td></tr>
      <tr><td>${t.tax}</td><td class="amt">${money(tot.tax)}</td></tr>
      <tr class="big"><td>${t.total}</td><td class="amt">${money(tot.total)}</td></tr>
      ${Q.fullPay ? '' : `<tr class="pay"><td>${t.deposit}</td><td class="amt">${money(tot.deposit)}</td></tr>
      <tr class="pay"><td>${t.balance}</td><td class="amt">${money(tot.balance)}</td></tr>`}
    </table>
    <div class="bank"><b>${t.bank}</b><br>${t.bankL}${C}${L === 'zh' ? lessor.bankZh : lessor.bankEn}<br>${t.acct}${C}${lessor.account}<br>${t.acctName}${C}${lessor.accountName}</div>
    ${logo}<span class="pageno">1 / 2</span>
    </div>
    <div class="sheet">
    <div class="terms"><b>${t.terms}</b><ol>${terms.map(s => Array.isArray(s)
      ? `<li>${esc(s[0])}<ul style="margin:2px 0;padding-left:16px">${s.slice(1).map(x => `<li>${esc(x)}</li>`).join('')}</ul></li>`
      : `<li>${esc(s)}</li>`).join('')}</ol></div>
    <div class="sign">
      <div>${t.client}<div class="ln"></div>${t.sign}</div>
      <div>${t.lessor}<div class="ln"></div>${t.sign}</div>
    </div>
    ${logo}<span class="pageno">2 / 2</span>
    </div>`;
}

// ---------- files ----------
function fileName() {
  const d = (Q.lines.find(l => l.date)?.date || Q.date).replace(/-/g, '');
  return Q.lang === 'zh' ? `可能存在的遊樂園_${d}${Q.event}報價單` : `CollaPlay_${d}_${Q.event}_Quotation`;
}
function printPdf() { const old = document.title; document.title = fileName(); window.print(); document.title = old; }
function saveJson() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(Q, null, 2)], { type:'application/json' }));
  a.download = fileName() + '.json'; a.click();
}
loader.onchange = async e => {
  try { Q = { ...Q, ...JSON.parse(await e.target.files[0].text()) }; renderEditor(); }
  catch { alert('無法讀取這個檔案，請選擇用「儲存草稿」下載的檔案'); }
  e.target.value = '';
};

renderEditor();
</script>
</body>
</html>
